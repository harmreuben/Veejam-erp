<!doctype html>
<html lang="en-KE">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Offline · VeeJam ERP</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f4f7f6;
        --fg: #14211d;
        --muted: #5b6b66;
        --primary: #0b6e5b;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0e1714;
          --fg: #e6efec;
          --muted: #9fb2ac;
          --primary: #4cc3a5;
        }
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        background: var(--bg);
        color: var(--fg);
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
        padding: 16px;
        box-sizing: border-box;
      }
      main {
        max-width: 26rem;
        text-align: center;
      }
      img {
        width: 64px;
        height: 64px;
        border-radius: 14px;
      }
      h1 {
        font-size: 1.4rem;
        margin: 1rem 0 0.5rem;
      }
      p {
        color: var(--muted);
        line-height: 1.5;
      }
      a {
        display: inline-block;
        margin-top: 1rem;
        padding: 0.6rem 1.2rem;
        border-radius: 8px;
        background: var(--primary);
        color: #fff;
        text-decoration: none;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1>No internet connection</h1>
      <p>
        VeeJam ERP needs the internet to show live figures, so nothing is saved on this device. Check your
        data or Wi-Fi and try again.
      </p>
      <a href="/">Try again</a>
    </main>
  </body>
</html>
